name: Auth Gateway CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:migrate
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
          SESSION_SECRET: test-session-secret-which-is-at-least-32-chars
          CSRF_SECRET: test-csrf-secret-which-is-at-least-32-chars
      - run: npm run typecheck
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
          SESSION_SECRET: test-session-secret-which-is-at-least-32-chars
          CSRF_SECRET: test-csrf-secret-which-is-at-least-32-chars
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
          SESSION_SECRET: test-session-secret-which-is-at-least-32-chars
          CSRF_SECRET: test-csrf-secret-which-is-at-least-32-chars
      - run: npm run build
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
          SESSION_SECRET: test-session-secret-which-is-at-least-32-chars
          CSRF_SECRET: test-csrf-secret-which-is-at-least-32-chars
